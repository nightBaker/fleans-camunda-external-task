name: release

# Push a tag v<version> (matching VersionPrefix/VersionSuffix in Directory.Build.props) to publish
# the NuGet package to nuget.org and the host image to ghcr.io.
#
# NuGet uses Trusted Publishing — no stored API key. The job's GitHub OIDC token is exchanged for a
# 1-hour nuget.org key, which requires a Trusted Publishing policy on nuget.org (owner nightBaker):
#   Repository Owner: nightBaker · Repository: fleans-camunda-external-task · Workflow File: release.yml
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write   # ghcr.io image
  id-token: write   # OIDC token for NuGet Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet test -c Release
      - run: dotnet pack src/Fleans.Plugins.CamundaExternalTask -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts
      # Requested right before the push: the temporary key is valid for one hour.
      - name: NuGet login (OIDC → temporary API key)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: nightBaker   # nuget.org profile name that owns the policy (not an email)
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push host image
        run: |
          image=ghcr.io/nightbaker/fleans-camunda-external-task
          docker build -t $image:${{ steps.ver.outputs.version }} -t $image:latest .
          docker push $image:${{ steps.ver.outputs.version }}
          docker push $image:latest
