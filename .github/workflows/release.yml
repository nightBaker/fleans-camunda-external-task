name: release

# Push a tag v<version> (matching VersionPrefix in Directory.Build.props) to publish the NuGet
# package to nuget.org (secret NUGET_API_KEY) and the host image to ghcr.io.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet test -c Release
      - run: dotnet pack src/Fleans.Plugins.CamundaExternalTask -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push host image
        run: |
          image=ghcr.io/nightbaker/fleans-camunda-external-task
          docker build -t $image:${{ steps.ver.outputs.version }} -t $image:latest .
          docker push $image:${{ steps.ver.outputs.version }}
          docker push $image:latest
